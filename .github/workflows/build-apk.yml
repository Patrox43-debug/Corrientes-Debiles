name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK with Gradle
        working-directory: ./android-app
        run: |
          gradle assembleDebug --stacktrace

      - name: Rename and Prepare APK
        run: |
          VERSION=$(grep 'versionName' android-app/app/build.gradle | head -n 1 | awk -F'"' '{print $2}')
          if [ -z "$VERSION" ]; then VERSION="1.0.0"; fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          cp android-app/app/build/outputs/apk/debug/app-debug.apk "CDmantencion_v${VERSION}.apk"
          cp android-app/app/build/outputs/apk/debug/app-debug.apk "CDmantencion.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CDmantencion_v${{ env.APP_VERSION }}_APK
          path: |
            CDmantencion_v*.apk
            CDmantencion.apk

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v${APP_VERSION}"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "El release $TAG_NAME ya existe, actualizando APKs..."
            gh release upload "$TAG_NAME" "CDmantencion_v${APP_VERSION}.apk" CDmantencion.apk --clobber
          else
            echo "Creando nuevo release $TAG_NAME..."
            gh release create "$TAG_NAME" "CDmantencion_v${APP_VERSION}.apk" CDmantencion.apk \
              --title "CDmantencion v${APP_VERSION}" \
              --notes "Actualización automática de CDmantencion v${APP_VERSION} para Android."
          fi
