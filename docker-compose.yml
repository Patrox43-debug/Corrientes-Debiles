version: '3.8'

services:
  cdmantencion:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8080
      - HOST=0.0.0.0
      - APP_URL=https://mantencion.cfelbc.cl
      - DB_PATH=/app/data/inventario.db
    volumes:
      - mantencion_data:/app/data

volumes:
  mantencion_data:
    driver: local
